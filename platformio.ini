; Clap-Activated Smart Lamp
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; ESP32 DevKit firmware
[env:esp32dev]
platform = espressif32 @ 6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -O2
    -DCORE_DEBUG_LEVEL=1

; Host-side unit tests for lib/ClapDSP:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -O1
